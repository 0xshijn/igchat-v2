name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .[dev]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Code Style Check
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: black --check .

      - name: Static Type Checking (mypy)
        run: mypy igchat main.py scripts examples tests

      - name: Run Pytest Suite
        run: pytest tests/ -v

      - name: Run 54/54 Bot Command Suite
        run: python tests/test_all_commands.py

  go-bridge-test:
    name: Go Bridge on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: bridge/go.sum

      - name: Go Vet & Test
        working-directory: bridge
        run: |
          go vet . ./bridge
          go test -v . ./bridge

      - name: Build Go Bridge
        working-directory: bridge
        run: |
          go build -trimpath -ldflags="-s -w -X main.bridgeVersion=3.0.0" -o ../build/igchat-bridge .

  package-check:
    name: Build & Verify PyPI Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build and twine
        run: python -m pip install --upgrade pip build twine

      - name: Build Distribution Packages
        run: python -m build

      - name: Validate Package Metadata
        run: twine check --strict dist/*
