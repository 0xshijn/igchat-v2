[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "igchat-v2"
version = "3.1.0"
description = "Async-first Instagram Direct & Polaris Web GraphQL client library in Python & Go."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Phước Toàn (Shiin)" },
]
maintainers = [
    { name = "Phước Toàn (Shiin)" },
]
keywords = [
    "instagram",
    "instagram-direct",
    "igchat",
    "instagram-api",
    "instameow",
    "polaris-graphql",
    "chatbot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/0xshijn/igchat-v2"
Documentation = "https://github.com/0xshijn/igchat-v2#readme"
Repository = "https://github.com/0xshijn/igchat-v2"
Issues = "https://github.com/0xshijn/igchat-v2/issues"
Changelog = "https://github.com/0xshijn/igchat-v2/blob/main/CHANGELOG.md"
Telegram = "https://t.me/ShiinNoHacker"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black",
    "mypy>=1.11.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["igchat"]

[tool.hatch.build.targets.sdist]
include = [
    "/igchat/**",
    "/README.md",
    "/README_EN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/config.json",
    "**/.session_cache.json",
    "/build/**",
    "/dist/**",
    "/.artifacts/**",
    "/tests/**",
    "/.venv*/**",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F"]

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.mypy]
python_version = "3.10"
mypy_path = "."
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
files = [
    "igchat",
    "main.py",
    "scripts",
    "examples",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
